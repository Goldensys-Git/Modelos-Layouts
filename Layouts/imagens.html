<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout de Imagens</title>
    <link rel="stylesheet" href="../grids.css">
    <style>
        .border {
            border: 1px solid gray;
        }

        .row{
            margin-bottom: 10px;
        }

        .coluna-imagem2{
            height: 100px;
        }

        .coluna-imagem3{
            padding: 20px;
        }

        .borda-image{
            border: 1px solid rgb(124, 124, 247);
            border-radius: 10px;
        }


    </style>
</head>

<body>

    <div class="container">



        <div class="row">
            <div class="col-12 border">
                <h1>Imagens</h1>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <a href="imagens.html">Voltar</a>
            </div>
        </div>

        <div class="row gap-1">
            <div class="col-4">
                <img src="../imagens/Gato.jpg" class="img-responsive" alt="">

            </div>
            <div class="col-8 border">Div sem espaçamento interno</div>
        </div>

        <div class="row gap-2">
            <div class="col-4 coluna-imagem2 border">
                <img src="../imagens/PeixeRemo.jpg" alt="" class="img-fill">
            </div>

            <div class="col-8">
                Imagem com classe para ocupar 100% do Espaço
            </div>
        </div>

        
        <div class="row gap-1">
            <div class="col-4 coluna-imagem3 borda-image ">
                <img src="../imagens/Gato2.jpg" class="img-responsive" alt="">

            </div>
            <div class="col-8 border">Imagem com espaçamento interno</div>
        </div>



    </div>

</body>

</html>
